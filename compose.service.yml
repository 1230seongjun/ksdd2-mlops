services:
  api:
    build: ./serving/api
    restart: unless-stopped
    networks:
      - default
      - mlops-net

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./infra/service/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./serving/web:/usr/share/nginx/html:ro
    depends_on:
      - api

networks:
  mlops-net:
    external: true
    name: ksdd2-mlops-infra_mlops-net
