services:
  api:
    build: ./serving/api
    restart: unless-stopped
    networks:
      - default
      - mlops-net

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./infra/service/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./serving/web:/usr/share/nginx/html:ro
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/service/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana

networks:
  mlops-net:
    external: true
    name: ksdd2-mlops-infra_mlops-net
volumes:
  prometheus-data:
  grafana-data:
