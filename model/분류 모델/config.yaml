# ---------- 데이터 ----------
DATA_SOURCE: object_storage       # local | object_storage
DATA_DIR: 'data'                  # DATA_SOURCE 가 local 일 때 이미지를 읽는 폴더
LABEL_DIR_NAMES: ['갈적색결함', '밝은 청색 결함', '어두운 청색 결함', '표면 결함', '흑색 결함']   # 클래스 번호 1~5 가 이 순서 (0 = 배경)
NORMAL_DIR_NAME: '미분류'          # 마스크 없이 전부 배경(0)으로 학습하는 정상 이미지 폴더. null 이면 정상을 안 쓴다
MASK_DIR_NAME: '결함마스크'        # {번호}_GT.png 만 쓴다
PART_MASK_NAMES: {'밝은 청색 결함': '청색', '흑색 결함': '검정', '표면 결함': '표면'}   # 한 이미지가 두 폴더에 있을 때 읽는 색별 마스크 {번호}_GT(이름).png

# ---------- 오브젝트 스토리지 (DATA_SOURCE 가 object_storage 일 때만 사용) ----------
# 접근 키는 여기 쓰지 말고 환경변수/.env 의 OBJECT_STORAGE_ACCESS_KEY, OBJECT_STORAGE_SECRET_KEY 로 넣는다
OBJECT_STORAGE_PREFIX: '분류모델데이터셋'   # 버킷 안에서 라벨 폴더들이 들어 있는 폴더
CACHE_DIR: data                   # 내려받은 이미지를 두는 폴더 (.gitignore 에 넣을 것)

# ---------- 분할: 결함과 정상을 따로 같은 비율로 test 와 교차검증 fold 로 나눈다 ----------
TEST_RATIO: 0.2                   # 마지막에 한 번만 쓰는 test 비율
N_FOLDS: 5                        # 나머지로 교차검증할 fold 수
RANDOM_SEED: 42                   # 데이터 분할 (같은 값이면 팀 전체가 같은 분할을 쓴다)

# ---------- 이미지 ----------
IMAGE_HEIGHT: 597                 # 원본 크기. 다른 크기의 이미지가 들어오면 멈춘다 (U-Net 입력은 32의 배수로 자동 패딩)
IMAGE_WIDTH: 184

# ---------- 모델 / 학습 ----------
ENCODER: resnet34                 # 부품 교체: resnet18, efficientnet-b0 등
ENCODER_WEIGHTS: imagenet         # 미리 학습된 가중치 (첫 실행 때 자동 다운로드). 안 쓰면 null
MODEL_SEED: 42
EPOCHS: 60
BATCH_SIZE: 8
LR: 0.0003
LR_SCHEDULE: cosine               # 학습률을 EPOCHS 에 걸쳐 LR → LR_MIN 으로 낮춤. 고정하려면 null
LR_MIN: 0.000001
DICE_WEIGHT: 0.5                  # 손실 = DICE_WEIGHT*Dice + (1-DICE_WEIGHT)*CrossEntropy
PATIENCE: 15                      # 검증 점수가 이 에폭 수만큼 안 오르면 조기 종료. null 이면 EPOCHS 까지 다 돌림

# ---------- 평가 / 판정 기준 ----------
GOOD_ACCURACY: 0.85               # 이미지 색 정확도의 좋음/보통 기준
OK_ACCURACY: 0.70
GOOD_DICE: 0.75                   # 결함 위치 Dice 의 좋음/보통 기준
OK_DICE: 0.60
WEAK_RECALL: 0.60                 # 어떤 색을 맞힌 비율이 이보다 낮으면 '약한 색'으로 적음

# ---------- MLflow ----------
MLFLOW_EXPERIMENT: 분류모델        # 서버 주소는 common.yaml
SAVE_MODEL: true                 # 이 fold 의 최고 가중치를 MLflow 모델 레지스트리에 새 버전으로 등록한다 (fold 비교 중에는 false)
REGISTERED_MODEL_NAME: Zero-Defects-Classifier   # 같은 이름으로 등록하면 버전이 하나씩 늘어난다
RUN_NAME: color_normal_cosine     # MLflow run 이름은 RUN_NAME_fold번호 (summary.py 가 이 이름으로 fold 결과를 모은다)
