name: NCR check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ncr-check.yml"

jobs:
  ncr:
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ secrets.NCR_REGISTRY }}/ksdd2-registry/hello-world
    steps:
      - name: Login to NCR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.NCR_REGISTRY }}
          username: ${{ secrets.NCR_ACCESS_KEY }}
          password: ${{ secrets.NCR_SECRET_KEY }}

      - name: Push test (GitHub -> NCR)
        run: |
          docker pull hello-world
          docker tag hello-world "$IMAGE:gha-${{ github.run_number }}"
          docker push "$IMAGE:gha-${{ github.run_number }}"

      - name: Pull test (NCR -> GitHub)
        run: |
          docker rmi "$IMAGE:gha-${{ github.run_number }}"
          docker pull "$IMAGE:gha-${{ github.run_number }}"
          docker run --rm "$IMAGE:gha-${{ github.run_number }}"
