name: Build and deploy

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/mlops/mlflow/**"
      - "serving/api/**"
      - "serving/ui/**"
      - "infra/service/**"
  push:
    branches: [main]
    paths:
      - "infra/mlops/mlflow/**"
      - "serving/api/**"
      - "serving/ui/**"
      - "infra/service/**"
  workflow_dispatch:
    inputs:
      image:
        description: "빌드·배포할 이미지"
        type: choice
        options: [api, ui, mlflow]

permissions:
  contents: read
  pull-requests: read

env:
  REGISTRY_PATH: ksdd2-registry
  DEPLOY_DIR: /opt/bulryangzero
  COMPOSE_FILE_NAME: compose.service.yaml
  COMPOSE_PROJECT: service
  # 서비스 스택 담당과 맞출 값: Nginx를 통해 API 헬스체크를 받는 주소
  HEALTH_URL: http://localhost:8080/api/ready

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.pick.outputs.images }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed images
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            mlflow:
              - "infra/mlops/mlflow/**"
            api:
              - "serving/api/**"
            ui:
              - "serving/ui/**"

      - name: Pick images to build
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'images=["${{ inputs.image }}"]' >> "$GITHUB_OUTPUT"
          else
            echo 'images=${{ steps.filter.outputs.changes }}' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.images != '' && needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set build context and tag
        run: |
          case "${{ matrix.image }}" in
            mlflow) echo "CONTEXT=infra/mlops/mlflow" >> "$GITHUB_ENV" ;;
            api)    echo "CONTEXT=serving/api"        >> "$GITHUB_ENV" ;;
            ui)     echo "CONTEXT=serving/ui"         >> "$GITHUB_ENV" ;;
          esac
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Login to NCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.NCR_REGISTRY }}
          username: ${{ secrets.NCR_ACCESS_KEY }}
          password: ${{ secrets.NCR_SECRET_KEY }}

      - name: Build (push only on main)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ secrets.NCR_REGISTRY }}/${{ env.REGISTRY_PATH }}/${{ matrix.image }}:${{ env.SHORT_SHA }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: [changes, build]
    # PR에서는 절대 실행하지 않음 (셀프 호스티드 러너 보호)
    # 이미지 변경 없이 infra/service 설정만 바뀐 경우(build=skipped)에도 배포
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.changes.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: [self-hosted, main-instance]
    concurrency:
      group: deploy-main-instance
      cancel-in-progress: false
    env:
      IMAGES: ${{ needs.changes.outputs.images }}
    steps:
      - uses: actions/checkout@v4

      - name: Check service stack exists
        id: ready
        run: |
          if [ -f "infra/service/${COMPOSE_FILE_NAME}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "infra/service/${COMPOSE_FILE_NAME} 이 아직 없어 배포를 건너뜁니다."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to NCR
        if: steps.ready.outputs.ready == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.NCR_REGISTRY }}
          username: ${{ secrets.NCR_ACCESS_KEY }}
          password: ${{ secrets.NCR_SECRET_KEY }}

      - name: Sync deploy files
        if: steps.ready.outputs.ready == 'true'
        run: |
          rsync -a --delete \
            --exclude ".env" --exclude ".env.prev" \
            infra/service/ "${DEPLOY_DIR}/"

      - name: Update image tags in .env
        if: steps.ready.outputs.ready == 'true'
        env:
          NCR_REGISTRY: ${{ secrets.NCR_REGISTRY }}
        run: |
          cd "${DEPLOY_DIR}"
          cp .env .env.prev

          set_env() {
            if grep -q "^$1=" .env; then
              sed -i "s|^$1=.*|$1=$2|" .env
            else
              echo "$1=$2" >> .env
            fi
          }

          set_env NCR_REGISTRY "${NCR_REGISTRY}"
          set_env REGISTRY_PATH "${REGISTRY_PATH}"

          SHORT_SHA="${GITHUB_SHA::7}"
          for img in $(python3 -c 'import json,os; print(" ".join(json.loads(os.environ.get("IMAGES") or "[]")))'); do
            case "$img" in
              api) set_env API_TAG "${SHORT_SHA}" ;;
              ui)  set_env UI_TAG  "${SHORT_SHA}" ;;
              *)   echo "$img 은 서비스 스택 배포 대상이 아님 (건너뜀)" ;;
            esac
          done

          echo "--- 배포할 태그 ---"
          grep -E '^(API_TAG|UI_TAG)=' .env || true

      - name: Deploy
        id: deploy
        if: steps.ready.outputs.ready == 'true'
        run: |
          cd "${DEPLOY_DIR}"
          docker compose -f "${COMPOSE_FILE_NAME}" -p "${COMPOSE_PROJECT}" --env-file .env pull
          docker compose -f "${COMPOSE_FILE_NAME}" -p "${COMPOSE_PROJECT}" --env-file .env up -d --remove-orphans
          docker compose -f "${COMPOSE_FILE_NAME}" -p "${COMPOSE_PROJECT}" ps

      - name: Health check
        if: steps.ready.outputs.ready == 'true'
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "${HEALTH_URL}"; then
              echo; echo "헬스체크 통과"; exit 0
            fi
            echo "대기 중... ($i/20)"; sleep 3
          done
          echo "헬스체크 실패"; exit 1

      - name: Rollback on failure
        if: failure() && steps.ready.outputs.ready == 'true'
        run: |
          cd "${DEPLOY_DIR}"
          if [ -f .env.prev ]; then
            echo "이전 버전으로 롤백합니다."
            cp .env.prev .env
            docker compose -f "${COMPOSE_FILE_NAME}" -p "${COMPOSE_PROJECT}" --env-file .env up -d --remove-orphans
          fi
