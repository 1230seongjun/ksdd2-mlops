name: Build images

# 프로젝트 종료 후 셀프 호스티드 러너와 NCR을 정리해, 이 워크플로는 이미지 빌드 검증만 합니다.
# 운영 당시의 자동 배포·롤백 파이프라인은 태그 v1.0-operated 의 deploy.yaml 과
# .github/scripts/deploy_stack.sh 에 남아 있습니다.

on:
  pull_request:
    branches: [main]
    paths:
      - "serving/api/**"
      - "infra/mlops/mlflow/**"
      - "infra/mlops/experiments-ui/**"
  push:
    branches: [main]
    paths:
      - "serving/api/**"
      - "infra/mlops/mlflow/**"
      - "infra/mlops/experiments-ui/**"
  workflow_dispatch:
    inputs:
      target:
        description: "빌드 검증 대상"
        type: choice
        default: all
        options: [all, api, mlflow, experiments-ui]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.pick.outputs.images }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changes
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - "serving/api/**"
            mlflow:
              - "infra/mlops/mlflow/**"
            experiments_ui:
              - "infra/mlops/experiments-ui/**"

      - name: Pick images
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          TARGET: ${{ inputs.target }}
          F_API: ${{ steps.filter.outputs.api }}
          F_MLFLOW: ${{ steps.filter.outputs.mlflow }}
          F_UI: ${{ steps.filter.outputs.experiments_ui }}
        run: |
          imgs=""
          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$TARGET" in
              all)            imgs="api mlflow experiments-ui" ;;
              api)            imgs="api" ;;
              mlflow)         imgs="mlflow" ;;
              experiments-ui) imgs="experiments-ui" ;;
            esac
          else
            if [ "$F_API" = "true" ];    then imgs="$imgs api"; fi
            if [ "$F_MLFLOW" = "true" ]; then imgs="$imgs mlflow"; fi
            if [ "$F_UI" = "true" ];     then imgs="$imgs experiments-ui"; fi
          fi
          images=$(python3 -c 'import json,sys; print(json.dumps(sys.argv[1:]))' $imgs)
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "빌드 검증 대상: $images"

  build:
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set build context
        run: |
          case "${{ matrix.image }}" in
            mlflow)         echo "CONTEXT=infra/mlops/mlflow"         >> "$GITHUB_ENV" ;;
            api)            echo "CONTEXT=serving/api"                >> "$GITHUB_ENV" ;;
            experiments-ui) echo "CONTEXT=infra/mlops/experiments-ui" >> "$GITHUB_ENV" ;;
          esac

      - uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          push: false
          tags: bulryangzero/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
