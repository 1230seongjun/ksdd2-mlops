name: Build images

# 이미지를 빌드해 GHCR(GitHub Container Registry, OCI 레지스트리)에 게시합니다.
#   - PR: 빌드만 검증 (push 안 함)
#   - main: ghcr.io/<저장소>/<이미지>:latest 와 :<커밋 SHA 7자리> 로 push
# 로컬 실행 매니페스트(deploy/local/ksdd2.yaml)가 이 이미지들을 받아 씁니다.
#
# 운영 당시(NHN Cloud)의 NCR push · 셀프 호스티드 러너 자동 배포 · 롤백 파이프라인은
# 태그 v1.0-operated 의 deploy.yaml 과 .github/scripts/deploy_stack.sh 에 남아 있습니다.

on:
  pull_request:
    branches: [main]
    paths:
      - "serving/**"
      - "infra/mlops/mlflow/**"
      - "infra/mlops/experiments-ui/**"
      - "infra/mlops/db/**"
      - "infra/service/monitoring/grafana/dashboards/**"
      - "model/**"
      - "deploy/local/**"
      - ".github/workflows/deploy.yaml"
  push:
    branches: [main]
    paths:
      - "serving/**"
      - "infra/mlops/mlflow/**"
      - "infra/mlops/experiments-ui/**"
      - "infra/mlops/db/**"
      - "infra/service/monitoring/grafana/dashboards/**"
      - "model/**"
      - "deploy/local/**"
      - ".github/workflows/deploy.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: serving/api
            file: serving/api/Dockerfile
          - image: mlflow
            context: infra/mlops/mlflow
            file: infra/mlops/mlflow/Dockerfile
          - image: experiments-ui
            context: infra/mlops/experiments-ui
            file: infra/mlops/experiments-ui/Dockerfile
          # 아래 4개는 로컬 실행용. 저장소 파일을 함께 넣어야 해서 빌드 컨텍스트가 저장소 최상단
          - image: web
            context: .
            file: deploy/local/web/Containerfile
          - image: grafana
            context: .
            file: deploy/local/grafana/Containerfile
          - image: postgres
            context: .
            file: deploy/local/postgres/Containerfile
          - image: trainer
            context: .
            file: deploy/local/trainer/Containerfile
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.image }}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (push on main)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.SHORT_SHA }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
