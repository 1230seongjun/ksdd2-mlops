name: Build and deploy

on:
  pull_request:
    branches: [main]
    paths:
      - "serving/api/**"
      - "serving/web/**"
      - "infra/service/**"
      - "infra/mlops/mlflow/**"
      - "infra/mlops/experiments-ui/**"
      - "infra/mlops/compose.mlops.yaml"
      - ".github/scripts/deploy_stack.sh"
  push:
    branches: [main]
    paths:
      - "serving/api/**"
      - "serving/web/**"
      - "infra/service/**"
      - "infra/mlops/mlflow/**"
      - "infra/mlops/experiments-ui/**"
      - "infra/mlops/compose.mlops.yaml"
      - ".github/scripts/deploy_stack.sh"
  workflow_dispatch:
    inputs:
      target:
        description: "빌드·배포 대상 (all: api+mlflow+experiments-ui 빌드 후 두 스택 배포 / deploy-only: 빌드 없이 재배포) — serving/ui 는 아직 CD 대상 아님"
        type: choice
        default: all
        options: [all, api, mlflow, experiments-ui, deploy-only]

permissions:
  contents: read
  pull-requests: read

env:
  REGISTRY_PATH: ksdd2-registry
  DEPLOY_DIR: /opt/bulryangzero
  COMPOSE_FILE_NAME: compose.service.yaml
  COMPOSE_PROJECT: service
  # 서비스 스택 담당과 맞출 값: Nginx를 통해 API 헬스체크를 받는 주소
  HEALTH_URL: http://localhost:8080/api/ready

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.pick.outputs.images }}
      service: ${{ steps.pick.outputs.service }}
      mlops: ${{ steps.pick.outputs.mlops }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changes
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - "serving/api/**"
            mlflow:
              - "infra/mlops/mlflow/**"
            experiments_ui:
              - "infra/mlops/experiments-ui/**"
            service:
              - "serving/api/**"
              - "serving/web/**"
              - "infra/service/**"
            mlops:
              - "infra/mlops/mlflow/**"
              - "infra/mlops/experiments-ui/**"
              - "infra/mlops/compose.mlops.yaml"
            script:
              - ".github/scripts/deploy_stack.sh"

      - name: Pick images and stacks
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          TARGET: ${{ inputs.target }}
          F_API: ${{ steps.filter.outputs.api }}
          F_MLFLOW: ${{ steps.filter.outputs.mlflow }}
          F_UI: ${{ steps.filter.outputs.experiments_ui }}
          F_SERVICE: ${{ steps.filter.outputs.service }}
          F_MLOPS: ${{ steps.filter.outputs.mlops }}
          F_SCRIPT: ${{ steps.filter.outputs.script }}
        run: |
          imgs=""; svc=false; mlo=false
          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$TARGET" in
              all)            imgs="api mlflow experiments-ui"; svc=true; mlo=true ;;
              api)            imgs="api";            svc=true ;;
              mlflow)         imgs="mlflow";         mlo=true ;;
              experiments-ui) imgs="experiments-ui"; mlo=true ;;
              deploy-only)    svc=true; mlo=true ;;
            esac
          else
            if [ "$F_API" = "true" ];    then imgs="$imgs api"; fi
            if [ "$F_MLFLOW" = "true" ]; then imgs="$imgs mlflow"; fi
            if [ "$F_UI" = "true" ];     then imgs="$imgs experiments-ui"; fi
            if [ "$F_SERVICE" = "true" ] || [ "$F_SCRIPT" = "true" ]; then svc=true; fi
            if [ "$F_MLOPS" = "true" ]   || [ "$F_SCRIPT" = "true" ]; then mlo=true; fi
          fi
          images=$(python3 -c 'import json,sys; print(json.dumps(sys.argv[1:]))' $imgs)
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "service=$svc"   >> "$GITHUB_OUTPUT"
          echo "mlops=$mlo"     >> "$GITHUB_OUTPUT"
          echo "빌드: $images / 배포: service=$svc mlops=$mlo"

  build:
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set build context and tag
        run: |
          case "${{ matrix.image }}" in
            mlflow)         echo "CONTEXT=infra/mlops/mlflow"         >> "$GITHUB_ENV" ;;
            api)            echo "CONTEXT=serving/api"                >> "$GITHUB_ENV" ;;
            experiments-ui) echo "CONTEXT=infra/mlops/experiments-ui" >> "$GITHUB_ENV" ;;
          esac
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Login to NCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.NCR_REGISTRY }}
          username: ${{ secrets.NCR_ACCESS_KEY }}
          password: ${{ secrets.NCR_SECRET_KEY }}

      - name: Build (push only on main)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ secrets.NCR_REGISTRY }}/${{ env.REGISTRY_PATH }}/${{ matrix.image }}:${{ env.SHORT_SHA }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # 인스턴스 분리: MLOps 스택은 mlops 인스턴스, 서비스 스택은 service 인스턴스의 러너가 배포
  # 서비스(API)가 MLflow에서 모델을 불러오므로 MLOps 먼저 → 서비스 순서
  deploy-mlops:
    needs: [changes, build]
    # PR에서는 절대 실행하지 않음 (셀프 호스티드 러너 보호)
    # 이미지 변경 없이 설정만 바뀐 경우(build=skipped)에도 배포
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.changes.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      needs.changes.outputs.mlops == 'true'
    runs-on: [self-hosted, mlops]
    concurrency:
      group: deploy-mlops-instance
      cancel-in-progress: false
    env:
      IMAGES: ${{ needs.changes.outputs.images }}
      NCR_REGISTRY: ${{ secrets.NCR_REGISTRY }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to NCR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.NCR_REGISTRY }}
          username: ${{ secrets.NCR_ACCESS_KEY }}
          password: ${{ secrets.NCR_SECRET_KEY }}

      - name: Deploy MLOps stack (PostgreSQL · MLflow · 실험 대시보드)
        run: bash .github/scripts/deploy_stack.sh mlops

  deploy-service:
    needs: [changes, build, deploy-mlops]
    # MLOps 배포가 성공했거나 이번에 대상이 아니었을 때(skipped)만 서비스 배포
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.changes.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.deploy-mlops.result == 'success' || needs.deploy-mlops.result == 'skipped') &&
      needs.changes.outputs.service == 'true'
    runs-on: [self-hosted, service]
    concurrency:
      group: deploy-service-instance
      cancel-in-progress: false
    env:
      IMAGES: ${{ needs.changes.outputs.images }}
      NCR_REGISTRY: ${{ secrets.NCR_REGISTRY }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to NCR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.NCR_REGISTRY }}
          username: ${{ secrets.NCR_ACCESS_KEY }}
          password: ${{ secrets.NCR_SECRET_KEY }}

      - name: Deploy service stack (API · Nginx · Prometheus · Grafana)
        run: bash .github/scripts/deploy_stack.sh service
