name: Build and push images

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/mlops/mlflow/**"
      - "serving/api/**"
      - "serving/ui/**"
  push:
    branches: [main]
    paths:
      - "infra/mlops/mlflow/**"
      - "serving/api/**"
      - "serving/ui/**"
  workflow_dispatch:
    inputs:
      image:
        description: "빌드할 이미지"
        type: choice
        options: [mlflow, api, ui]

permissions:
  contents: read
  pull-requests: read

env:
  REGISTRY_PATH: ksdd2-registry

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.pick.outputs.images }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed images
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            mlflow:
              - "infra/mlops/mlflow/**"
            api:
              - "serving/api/**"
            ui:
              - "serving/ui/**"

      - name: Pick images to build
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'images=["${{ inputs.image }}"]' >> "$GITHUB_OUTPUT"
          else
            echo 'images=${{ steps.filter.outputs.changes }}' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.images != '' && needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set build context and tag
        run: |
          case "${{ matrix.image }}" in
            mlflow) echo "CONTEXT=infra/mlops/mlflow" >> "$GITHUB_ENV" ;;
            api)    echo "CONTEXT=serving/api"        >> "$GITHUB_ENV" ;;
            ui)     echo "CONTEXT=serving/ui"         >> "$GITHUB_ENV" ;;
          esac
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Login to NCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.NCR_REGISTRY }}
          username: ${{ secrets.NCR_ACCESS_KEY }}
          password: ${{ secrets.NCR_SECRET_KEY }}

      - name: Build (push only on main)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ secrets.NCR_REGISTRY }}/${{ env.REGISTRY_PATH }}/${{ matrix.image }}:${{ env.SHORT_SHA }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
