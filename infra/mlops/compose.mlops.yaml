
name: ksdd2-mlops-infra

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} 
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mlops-net

  mlflow:
    image: ${NCR_REGISTRY}/${REGISTRY_PATH}/mlflow:${MLFLOW_TAG:?MLFLOW_TAG is not set in .env}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}
    extra_hosts:
      - "kr1-api-object-storage.nhncloudservice.com:10.0.2.63"
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD_URLENCODED}@postgres:5432/${POSTGRES_DB}
      - --artifacts-destination
      - s3://${MLFLOW_ARTIFACT_BUCKET}
      - --serve-artifacts
      - --allowed-hosts
      - "localhost:5000,127.0.0.1:5000,mlflow:5000,${MLFLOW_PRIVATE_IP:?MLFLOW_PRIVATE_IP is not set in .env}:5000"
    ports:
      - "${MLFLOW_PRIVATE_IP:?MLFLOW_PRIVATE_IP is not set in .env}:5000:5000"
      - "127.0.0.1:5000:5000"
    networks:
      - mlops-net

  # 실험 대시보드 (Streamlit). MLflow API 로 run·artifact 를 읽기만 함
  experiments-ui:
    image: ${NCR_REGISTRY}/${REGISTRY_PATH}/experiments-ui:${EXPERIMENTS_UI_TAG:?EXPERIMENTS_UI_TAG is not set in .env}
    restart: unless-stopped
    depends_on:
      - mlflow
    environment:
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
    ports:
      - "${MLFLOW_PRIVATE_IP:?MLFLOW_PRIVATE_IP is not set in .env}:8502:8501"
      - "127.0.0.1:8502:8501"
    networks:
      - mlops-net

networks:
  mlops-net:
    name: ksdd2-mlops-infra_mlops-net
    driver: bridge



volumes:
  postgres_data:
