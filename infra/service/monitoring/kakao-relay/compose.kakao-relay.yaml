# Grafana 알림 → 카카오톡 '나에게 보내기' 중계 서버
# 서비스 스택(ksdd2-mlops_default 네트워크)에 붙어서 Grafana가 http://kakao-relay:8080/alert 로 보냄
# 실행: docker compose -f compose.kakao-relay.yaml up -d
services:
  kakao-relay:
    image: python:3.12-slim
    container_name: kakao-relay
    restart: unless-stopped
    working_dir: /app
    command: ["python", "-u", "relay.py"]
    env_file: .env          # KAKAO_REST_API_KEY, KAKAO_CLIENT_SECRET, RELAY_TOKEN, ALERT_LINK, KAKAO_REDIRECT_URI
    volumes:
      - ./relay.py:/app/relay.py:ro
      - ./get_kakao_token.py:/app/get_kakao_token.py:ro
      - kakao-data:/data
    networks: [service]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  service:
    external: true
    name: ksdd2-mlops_default

volumes:
  kakao-data:
