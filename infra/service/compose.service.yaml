name: ksdd2-mlops

services:
  api:
    image: ${NCR_REGISTRY}/${REGISTRY_PATH}/api:${API_TAG:?API_TAG is not set in .env}
    restart: unless-stopped

    environment:
      MLFLOW_TRACKING_URI: "http://10.0.2.11:5000"
      MODEL_URI: "${MODEL_URI:?MODEL_URI is not set in .env}"

    networks:
      - default
      - mlops-net

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - --config.file=/etc/prometheus/conf/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus:/etc/prometheus/conf:ro
      - prometheus-data:/prometheus
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana

networks:
  mlops-net:
    external: true
    name: ksdd2-mlops-infra_mlops-net
volumes:
  prometheus-data:
  grafana-data:
