name: ksdd2-mlops

services:
  api:
    image: ${NCR_REGISTRY}/${REGISTRY_PATH}/api:${API_TAG:?API_TAG is not set in .env}
    restart: unless-stopped

    environment:
      GPU_TRAINING_URL: "${GPU_TRAINING_URL:-}"
      GPU_TRAINING_TOKEN: "${GPU_TRAINING_TOKEN:-}"
      MLFLOW_TRACKING_URI: "${MLFLOW_TRACKING_URI:?MLFLOW_TRACKING_URI is not set in .env}"
      MODEL_URI: "models:/Zero-Defects/2"
      CLASSIFIER_MODEL_URI: "models:/Zero-Defects-Classifier/1"
      CHALLENGER_MODEL_URI: ""
      CHALLENGER_CLASSIFIER_MODEL_URI: ""
      INFERENCE_DB_HOST: ${INFERENCE_DB_HOST:-}
      INFERENCE_DB_PORT: ${INFERENCE_DB_PORT:-}
      INFERENCE_DB_NAME: ${INFERENCE_DB_NAME:-}
      INFERENCE_DB_USER: ${INFERENCE_DB_USER:-}
      INFERENCE_DB_PASSWORD: ${INFERENCE_DB_PASSWORD:-}
    networks:
      - default

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - ./web:/usr/share/nginx/html:ro
      - ./tls:/etc/nginx/tls:ro
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - --config.file=/etc/prometheus/conf/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./monitoring/prometheus:/etc/prometheus/conf:ro
      - prometheus-data:/prometheus
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SERVER_ROOT_URL: "http://133.186.218.8:8080/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  prometheus-data:
  grafana-data:

