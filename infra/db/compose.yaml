# DB 티어: PostgreSQL (MLflow 메타데이터 DB + 검사 이력 DB)
#
# 애플리케이션 티어만 app-db 네트워크로 접근할 수 있고, 웹 티어와 외부에는 포트를 열지 않는다
# 실행: scripts/local.sh up   (DB → App → Web 순서)
name: ksdd2-db

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mlflow
      INFERENCE_DB_NAME: inference
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 빈 데이터 폴더로 처음 뜰 때만 실행: 검사 이력용 inference DB 생성 + 스키마 적용
      - ./schema:/schema:ro
      - ./schema/init-inference.sh:/docker-entrypoint-initdb.d/10-inference.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d mlflow
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app-db

networks:
  app-db:
    name: ksdd2-app-db

volumes:
  postgres_data:
