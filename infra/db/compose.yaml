# DB 티어: PostgreSQL (MLflow 메타데이터 DB + 검사 이력 DB)
#
# 애플리케이션 티어만 app-db 네트워크로 접근할 수 있고, 웹 티어와 외부에는 포트를 열지 않는다
# 실행: scripts/local.sh up   (DB → App → Web 순서)
name: ksdd2-db

# podman-compose 는 기본으로 프로젝트의 서비스를 pod 하나에 묶는데, 그러면 서비스마다 다른 네트워크(티어)에 붙일 수 없어서 끈다
# (docker compose 는 x- 로 시작하는 항목을 무시한다)
x-podman:
  in_pod: false

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mlflow
      INFERENCE_DB_NAME: inference
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 빈 데이터 폴더로 처음 뜰 때만 실행: 검사 이력용 inference DB 생성 + 스키마 적용
      - ./schema:/schema:ro
      - ./schema/init-inference.sh:/docker-entrypoint-initdb.d/10-inference.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d mlflow
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app-db

networks:
  app-db:
    name: ksdd2-app-db
    # 대역을 직접 정한다. 서버 네트워크가 10.x 를 쓰면 Podman 이 자동으로 고를 대역이 없어서 만들기에 실패한다
    ipam:
      config:
        - subnet: 172.30.10.0/24

volumes:
  postgres_data:
