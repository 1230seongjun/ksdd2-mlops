# 웹 티어: nginx (검사 화면, TLS, /api·/grafana 를 애플리케이션 티어로 전달)
#
# 외부(사용자)에게 열리는 곳은 이 티어뿐이고, DB 티어로 가는 네트워크에는 붙지 않는다
# 실행: scripts/local.sh up   (애플리케이션 티어가 먼저 떠 있어야 함)
name: ksdd2-web

# podman-compose 는 기본으로 프로젝트의 서비스를 pod 하나에 묶는데, 그러면 서비스마다 다른 네트워크(티어)에 붙일 수 없어서 끈다
# (docker compose 는 x- 로 시작하는 항목을 무시한다)
x-podman:
  in_pod: false

services:
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
    environment:
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"   # 설정의 ${NGINX_LOCAL_RESOLVERS} 를 이 컨테이너의 DNS 주소로 채운다
    volumes:
      - ./nginx:/etc/nginx/templates:ro,z   # *.template 을 시작할 때 conf.d 로 변환한다
      - ../../serving/web:/usr/share/nginx/html:ro,z
      - ./tls:/etc/nginx/tls:ro,z   # scripts/local.sh init 이 만든 자체 서명 인증서
    networks:
      web-app: {}
      grafana-auth:
        ipv4_address: 192.168.250.2

networks:
  web-app:
    external: true
    name: ksdd2-web-app
  grafana-auth:
    external: true
    name: ksdd2-grafana-auth
