# 로컬 실행용 데이터 소스. 대시보드 JSON 의 ${DS_PROMETHEUS} · ${DS_INFERENCE} 는 이미지 빌드 때 아래 uid 로 바뀝니다.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
  - name: 추론 DB (inference)
    uid: inference
    type: grafana-postgresql-datasource
    access: proxy
    url: 127.0.0.1:5432
    user: grafana_reader
    jsonData:
      database: inference
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: ${GRAFANA_READER_PASSWORD}
