# 로컬 실행용 nginx 설정
# 모든 컨테이너가 Pod 하나에서 localhost 를 공유하므로, 이름 해석(DNS) 없이 127.0.0.1 로 연결합니다.
# 운영 설정(infra/service/nginx/default.conf)과 경로 · 인증 흐름은 같고, HTTPS 대신 HTTP 를 씁니다.
server {
    listen 80;
    server_name _;

    client_max_body_size 6m;

    # 검사 화면
    location / {
        root /usr/share/nginx/html;
        index zerodefect-ui.html;
    }

    # 추론 API (/api/ready → /ready)
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Grafana 접근 전에 검사 화면 로그인 세션을 API 로 확인
    location = /_internal/grafana-auth {
        internal;
        proxy_pass http://127.0.0.1:8000/auth/grafana-proxy;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location = /api/auth/grafana-proxy {
        return 404;
    }

    # Grafana: 로그인한 사용자만, 사용자 이름을 헤더로 넘김 (인증 프록시)
    location /grafana/ {
        auth_request /_internal/grafana-auth;
        auth_request_set $grafana_user $upstream_http_x_defectcatch_user;
        proxy_set_header X-WEBAUTH-USER $grafana_user;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";

        proxy_pass http://127.0.0.1:3000;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
